<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Home Page </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>

    <div class="container mt-5">
        <h1 class="bg-primary text-white p-5 text-center"> Employee Database Management System Capstone Project-1 </h1>
        <table class="table table-bordered border-danger table-hover">
            <thead>
                <tr class="text-center">
                    <th> S.No </th>
                    <th> Full Name </th>
                    <th> Designation </th>
                    <th> Phone Number </th>
                </tr>
            </thead>
            <tbody>
                {% for x in employees %}
                <tr class="text-center">
                    <td> {{ x.id}} </td>
                    <td> <a href="{% url 'emp_detail' x.id %}"> {{ x.first_name }} {{ x.last_name }} </a></td>
                    <td> {{ x.designation }} </td>
                    <td> {{ x.phone_number }} </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
</body>
</html>
