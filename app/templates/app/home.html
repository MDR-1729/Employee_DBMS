<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Employee-DBMS Application </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>

     <div class="container mt-5">
          <h1 class="bg-primary text-white p-5 text-center">Employee Database Management System Capstone Project-1</h1>
          <table class="table table-bordered border-danger table-hover">
               <thead>
                    <tr style="background-color: #f2f2f2; text-align: center;">
                         <th>SNO</th>
                         <th>Full Name</th>
                         <th>Designation</th>
                         <th>Phone Number</th>
                    </tr>
               </thead>
               <tbody>
                    {% for x in employees %}
                     <tr style="text-align: center;">
                         <td>{{x.id}}</td>
                         <td><a href="{% url 'employee_detail' x.id %}">{{x.firstname}} {{x.last_name}}</a></td>
                         <td>{{x.designation}}</td>
                         <td>{{x.phone_number}}</td>
                     </tr>
                     {% endfor %}
               </tbody>
          </table>
     </div>

</body>
</html>
